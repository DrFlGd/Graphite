[package]
name = "graphite-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphite desktop app"

[lib]
name = "graphite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# Dictation (whisper.cpp) on desktops; phones use their keyboard's microphone.
graphite-core = { path = "../../../core", features = ["dictation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# To turn on microphone access in WebKitGTK, which is off by default.
webkit2gtk = "2.0"

[dependencies]
graphite-core = { path = "../../../core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
tungstenite.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
