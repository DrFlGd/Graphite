name: Release

# Pushing a tag like v0.1.0 builds the desktop installers and the CLI for
# every platform and publishes them on a GitHub release of the same name.
on:
  push:
    tags: ['v*']
  # Run by hand from the Actions tab: enter the version (e.g. 0.1.0); the tag
  # is created from the chosen branch if it does not exist yet.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 0.1.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version matches the app
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" apps/desktop/src-tauri/tauri.conf.json || { echo "tauri.conf.json is not at version $v"; exit 1; }
          grep -q "^version = \"$v\"" Cargo.toml || { echo "Cargo.toml is not at version $v"; exit 1; }
      - name: Create the tag if it does not exist
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG exists"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag -a "$TAG" -m "Graphite $TAG"
            git push origin "$TAG"
          fi
      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists, uploading into it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Graphite $TAG" --generate-notes
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out for now (Jerred, 2026-10-15): nobody needs it yet
        # and the universal build is the slowest job. To bring it back, add
        #   - name: macos-universal
        #     os: macos-latest
        #     tauri_args: --target universal-apple-darwin
        #     bundle_dir: target/universal-apple-darwin/release/bundle
        #     cli: graphite
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            cli: graphite
          - name: windows-x86_64
            os: windows-latest
            cli: graphite.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        run: pnpm --filter @graphite/desktop tauri build ${{ matrix.tauri_args }}

      - name: Build CLI
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release -p graphite-cli --target aarch64-apple-darwin
            cargo build --release -p graphite-cli --target x86_64-apple-darwin
            lipo -create -output out/graphite target/aarch64-apple-darwin/release/graphite target/x86_64-apple-darwin/release/graphite
          else
            cargo build --release -p graphite-cli
            cp target/release/${{ matrix.cli }} out/
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo build --release -p graphite-relay
            cp target/release/graphite-relay out/
          fi
          cd out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "graphite-cli-$TAG-${{ matrix.name }}.zip" graphite.exe
          else
            tar czf "graphite-cli-$TAG-${{ matrix.name }}.tar.gz" graphite
          fi
          if [ -f graphite-relay ]; then
            tar czf "graphite-relay-$TAG-${{ matrix.name }}.tar.gz" graphite-relay
          fi
          rm -f graphite graphite.exe graphite-relay

      - name: Collect installers
        shell: bash
        run: |
          bundle="${{ matrix.bundle_dir || 'target/release/bundle' }}"
          find "$bundle" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} out/ \;
          ls -l out

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The workflow's own ref, not the tag: release notes may be added to the
      # default branch after the tag was cut.
      - uses: actions/checkout@v4
      - name: Remove assets that are not installers or CLI archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -Ev '^(Graphite[_-]|graphite-cli-)' \
            | while read -r name; do
                echo "removing stray asset $name"
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
              done
      - name: Use the release notes from docs/releases when they exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            echo "no $notes, keeping the generated notes"
          fi
      - name: Mark the release as published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
