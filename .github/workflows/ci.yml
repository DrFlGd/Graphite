name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core + CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p graphite-core -p graphite-cli -p graphite-relay --all-targets -- -D warnings
      - run: cargo test -p graphite-core -p graphite-cli -p graphite-relay

  ui:
    name: UI package + desktop web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @graphite/desktop build:web

  desktop:
    name: Desktop app build (${{ matrix.os }})
    needs: [core, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build (no bundle)
        run: pnpm --filter @graphite/desktop tauri build --no-bundle
      # Binaries only for pushes to main, kept briefly: artifact storage on the
      # account is small, and a failed upload must not fail a green build.
      - name: Upload binary
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphite-desktop-${{ matrix.os }}
          path: |
            target/release/graphite-desktop
            target/release/graphite-desktop.exe
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android app build
    needs: [core, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.2.12479018
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: android
      - run: pnpm install --frozen-lockfile
      - name: Build APK (arm64)
        run: pnpm --filter @graphite/desktop tauri android build --apk --target aarch64
      - name: Sign with a throwaway key
        run: bash scripts/sign-apk.sh out
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          name: graphite-android
          path: out/*.apk
          retention-days: 7
