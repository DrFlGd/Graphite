[workspace]
resolver = "2"
members = ["core", "apps/cli", "apps/desktop/src-tauri", "apps/relay"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DrFlGd/Graphite"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "3"
walkdir = "2"
ignore = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
tracing = "0.1"
tempfile = "3"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
imagesize = "0.15"
ureq = "3"
scraper = "0.27"
htmd = "0.5"
automerge = "0.12"
dirs = "6"
proptest = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
